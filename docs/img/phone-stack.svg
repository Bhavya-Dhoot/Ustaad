<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 638" width="960" height="638" role="img" aria-labelledby="t d" stroke-linecap="round" stroke-linejoin="round">
<title id="t">Inside one phone: app screens, modules, two doors, model servers and model files</title>
<desc id="d">A stack of five layers inside one phone, from top to bottom. First the app screens, five tabs called Swarm, Models, Choir, Data and Memory, written in Jetpack Compose. Second the modules, each shown with its plain name and its package name: links (link), scheduler (sched), Agent Choir (choir), Data Union (pdu), MemoryCloud (memcloud), Knowledge Bank (kb), agent endpoint (agent) and Keep busy (busy). Third two doors to the outside. The node API on port 8787 signs every request with HMAC-SHA256 and serves paired phones. The agent endpoint on port 8790 serves this phone only, needs a key, and is for other apps. Fourth the model servers (llama.cpp): the chat model on the GPU, the embedding model for Data Union search, and the lending server used only during a split. Fifth the model files, stored on the phone, one file per model.</desc>
