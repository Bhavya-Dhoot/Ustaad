<text x="742" y="523.5" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="16" fill="#15171A">641 to 725 Mbps</text>
<text x="32" y="582" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="15" fill="#5E636B">Most pairs are one run per side. Sources and run counts: <tspan font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace">docs/SUMMARY.md</tspan>, section 4.</text>
