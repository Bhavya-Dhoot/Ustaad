<text x="48" y="252" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="16" fill="#15171A"><tspan x="48" dy="0">First word of an answer,</tspan><tspan x="48" dy="28">CPU against GPU, in seconds</tspan></text>
<text x="368" y="251" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="15" fill="#15171A">CPU</text>
<rect x="540" y="234" width="190" height="24" rx="0" fill="#E4E7E3" stroke="#15171A" stroke-width="2.5"/>
<text x="742" y="251.5" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="16" fill="#15171A">7.20 s</text>
<text x="368" y="287" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="15" fill="#15171A">GPU</text>
<rect x="540" y="270" width="68.35" height="24" rx="0" fill="#15171A" stroke="#15171A" stroke-width="2.5"/>
<text x="620.35" y="287.5" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="16" fill="#15171A">2.59 s</text>
<rect x="32" y="330" width="896" height="104" rx="12" fill="#FCFDFB" stroke="#15171A" stroke-width="2.5"/>
<text x="48" y="370" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="16" fill="#15171A"><tspan x="48" dy="0">The same question asked again,</tspan><tspan x="48" dy="28">in seconds</tspan></text>
<text x="368" y="369" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="15" fill="#15171A">First time</text>
