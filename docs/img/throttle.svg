<path d="M520 424 L520 429" fill="none" stroke="#15171A" stroke-width="2.5"/>
<text x="520" y="448" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="14" fill="#15171A" text-anchor="middle">15</text>
