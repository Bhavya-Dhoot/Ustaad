<rect x="640" y="338" width="288" height="100" rx="12" fill="#FCFDFB" stroke="#15171A" stroke-width="2.5"/>
<text x="656" y="369" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="14" fill="#15171A"><tspan x="656" dy="0">The slowest step starts when</tspan><tspan x="656" dy="26">the phone's shell temperature</tspan><tspan x="656" dy="26">reaches <tspan font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace">40.0 C</tspan>.</tspan></text>
<path d="M640 388 L606 388" fill="none" stroke="#15171A" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="32" y="514" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="15" fill="#5E636B">Phone C and Phone B, one evening. Thermal status alone does not show this.</text>
<text x="32" y="543" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="14" fill="#5E636B">Source: <tspan font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace">docs/benchmarks/2026-10-10-throttle-passive.md</tspan>, sections 5 and 6.</text>
