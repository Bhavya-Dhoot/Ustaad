<text x="760" y="187" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="14" fill="#5E636B" text-anchor="middle">its own model</text>
<path d="M200 208 L200 240 L760 240 L760 208" fill="none" stroke="#15171A" stroke-width="2.5"/>
