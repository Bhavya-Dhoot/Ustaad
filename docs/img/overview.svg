<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="t d" stroke-linecap="round" stroke-linejoin="round">
<title id="t">Three phones, one local AI: the link and the five things the phones do together</title>
<desc id="d">Three phones stand side by side: Phone A with a teal token, Phone B with a tangerine token and Phone C with a magenta token, each with its own model. One line joins all three and is labelled SwarmLink: local Wi-Fi, Wi-Fi Direct, Bluetooth as fallback. Under them a list names the five things the phones do together. Swarm spreads jobs over the phones. Agent Choir has several phones answer one problem and vote. Data Union searches across phones while the files stay where they are. MemoryCloud runs a model too large for one phone by splitting it across phones. Knowledge Bank shares saved answers between phones. A stamp at the bottom says: No cloud. No account. Nothing leaves the phones.</desc>
