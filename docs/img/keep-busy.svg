<text x="32" y="44" font-family="'Bricolage Grotesque','Geist','Segoe UI',system-ui,sans-serif" font-size="24" font-weight="700" fill="#15171A">Keep busy: what a phone does when nobody asks it anything</text>
<rect x="32" y="62" width="896" height="44" rx="12" fill="#FCFDFB" stroke="#15171A" stroke-width="2.5"/>
<text x="48" y="90" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="17" fill="#15171A"><tspan font-weight="700">Real work always goes first</tspan>: filler stops when a real request arrives.</text>
<rect x="32" y="164" width="96" height="119" rx="12" fill="#FCFDFB" stroke="#15171A" stroke-width="2.5"/>
<text x="48" y="190" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="16" font-weight="700" fill="#15171A">Off</text>
<text x="48" y="217" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="14" fill="#15171A"><tspan x="48" dy="0">default</tspan></text>
<rect x="205" y="164" width="176" height="119" rx="12" fill="#FCFDFB" stroke="#15171A" stroke-width="2.5"/>
<text x="221" y="190" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="16" font-weight="700" fill="#15171A">Waiting</text>
<text x="221" y="217" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="14" fill="#15171A"><tspan x="221" dy="0"><tspan font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace">5</tspan> seconds with</tspan><tspan x="221" dy="26">no real work</tspan></text>
<rect x="458" y="164" width="176" height="119" rx="12" fill="#FCFDFB" stroke="#15171A" stroke-width="2.5"/>
<text x="474" y="190" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="16" font-weight="700" fill="#15171A">Running</text>
<text x="474" y="217" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="14" fill="#15171A"><tspan x="474" dy="0">filler jobs</tspan><tspan x="474" dy="26">back to back</tspan></text>
<rect x="712" y="164" width="216" height="119" rx="12" fill="#FCFDFB" stroke="#15171A" stroke-width="2.5"/>
<text x="728" y="190" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="16" font-weight="700" fill="#15171A">Half duty</text>
<text x="728" y="217" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="14" fill="#15171A"><tspan x="728" dy="0">Warm phone, Thermal</tspan><tspan x="728" dy="26">Status <tspan font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace">2</tspan>: rests as</tspan><tspan x="728" dy="26">long as each job.</tspan></text>
<path d="M128 223.5 L205 223.5" fill="none" stroke="#15171A" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="166" y="212.5" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="14" fill="#15171A" text-anchor="middle">turn on</text>
