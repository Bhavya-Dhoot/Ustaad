<text x="240.8" y="494" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="14" fill="#5E636B">the owner's choice, one switch per phone, off whenever Ustaad starts</text>
<rect x="48" y="508" width="420" height="93" rx="12" fill="#FCFDFB" stroke="#15171A" stroke-width="2.5"/>
<text x="64" y="534" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="16" font-weight="700" fill="#15171A">Hammer off</text>
<text x="64" y="561" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="14" fill="#15171A"><tspan x="64" dy="0">Rest <tspan font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace">90</tspan> seconds, then back to normal.</tspan><tspan x="64" dy="26">Real work is not held by the rest.</tspan></text>
<rect x="492" y="508" width="420" height="93" rx="12" fill="#FCFDFB" stroke="#15171A" stroke-width="2.5"/>
<text x="508" y="534" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="16" font-weight="700" fill="#15171A">Hammer on</text>
<text x="508" y="561" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="14" fill="#15171A"><tspan x="508" dy="0">No half duty, runs flat out on a warm phone.</tspan><tspan x="508" dy="26">Heat, battery and real work still win.</tspan></text>
<path d="M860 508 L860 294" fill="none" stroke="#15171A" stroke-width="2.5" stroke-dasharray="7 6"/>
