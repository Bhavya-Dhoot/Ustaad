<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 635" width="960" height="635" role="img" aria-labelledby="t d" stroke-linecap="round" stroke-linejoin="round">
<title id="t">Keep busy: the states of a phone with nothing to do, and the Hammer switch</title>
<desc id="d">A state diagram of the Keep busy mode, the filler work a phone does when nobody asks it anything. A rule across the top: Real work always goes first, filler stops when a real request arrives. The states are Off (the default); Waiting (5 seconds with no real work); Running (filler jobs back to back); Half duty (warm phone, Thermal Status 2, it rests as long as each job lasts); and Paused (too hot at Thermal Status 3 or more, or battery under 30 percent and not charging, or Ustaad not on screen). Arrows: Off to Waiting when switched on; Waiting to Running; Running to Half duty at status 2 and back when cooler; Running and Half duty to Paused; Paused back to Waiting by itself; Running back to Waiting when a real request arrives. Below is the Hammer switch, the owner's choice, one per phone, off whenever Ustaad starts; a dashed line from Hammer on ends in a bar under Half duty, meaning Hammer on blocks half duty. Hammer on: no half duty, the phone runs flat out when warm, and heat, battery and real work still win. Hammer off: rest 90 seconds, then back to normal; real work is not held by the rest. Sources: busy/BusyPolicy.kt and docs/benchmarks/2026-10-11-hammer.md.</desc>
