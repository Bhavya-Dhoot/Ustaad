<path d="M250 327 L250 283" fill="none" stroke="#15171A" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="262" y="309" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="14" fill="#15171A">back by itself</text>
<rect x="32" y="466" width="896" height="147" rx="12" fill="#E4E7E3"/>
<rect x="48" y="478" width="40" height="20" rx="10" fill="#FCFDFB" stroke="#15171A" stroke-width="2.5"/>
<circle cx="78" cy="488" r="6" fill="#15171A"/>
