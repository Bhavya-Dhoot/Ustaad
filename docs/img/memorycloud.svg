<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 599" width="960" height="599" role="img" aria-labelledby="t d" stroke-linecap="round" stroke-linejoin="round">
<title id="t">A model too large for one phone: one model cut into three parts, one part per phone</title>
<desc id="d">One model, Qwen3-30B-A3B with 48 layers and 18.6 GB, drawn as a tall bar cut into three parts. The top part, layers 0 to 15, is magenta and belongs to Phone C, the driver, which runs the model server. The middle part, layers 16 to 31, is teal and belongs to Phone A, a lender. The bottom part, layers 32 to 47, is tangerine and belongs to Phone B, a lender. The lenders lend memory and run a small lending server. Arrows labelled layers run from the driver to each lender: 5743 MB to Phone A and 5991 MB to Phone B. Captions: on one phone the 18.6 GB model gave no token in 134 seconds and 23 background apps were killed. Three phones ran it at 5.7 to 6.4 tokens per second, first word after 1.5 to 2.8 seconds. A lender gets its own models back when the split ends or its driver disappears; in one test they were back after 27 seconds. One run: first load 319 seconds, second load 65 seconds. Sources: docs/SUMMARY.md section 4 and docs/CLAIMS.md rows MC3, MC4 and MC7.</desc>
